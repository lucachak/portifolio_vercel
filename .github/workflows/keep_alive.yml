name: Keep Alive - Render Services

on:
  schedule:
    # Roda a cada 12 minutos. 
    # (Evita que o Render durma após 15min e respeita o limite mínimo do GitHub)
    - cron: "*/12 * * * *"
  workflow_dispatch: # Permite rodar manualmente pelo GitHub

jobs:
  ping:
    name: Ping Render Services
    runs-on: ubuntu-latest
    timeout-minutes: 1

    steps:
      - name: Ping CambioMatic
        run: |
          echo "$(date '+%Y-%m-%d %H:%M:%S') - Fazendo request para https://cambiomatic.onrender.com ..."
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 40 https://cambiomatic.onrender.com)
          echo "$(date '+%Y-%m-%d %H:%M:%S') - Status: $STATUS"

      - name: Ping Fingen
        run: |
          echo "$(date '+%Y-%m-%d %H:%M:%S') - Fazendo request para https://fingen-app.onrender.com ..."
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 40 https://fingen-app.onrender.com)
          echo "$(date '+%Y-%m-%d %H:%M:%S') - Status: $STATUS"
