name: Keep Alive - Render Services

on:
  schedule:
    # Roda a cada 1 minuto (mínimo suportado pelo GitHub Actions)
    - cron: "* * * * *"
  workflow_dispatch: # Permite rodar manualmente pelo GitHub

jobs:
  ping:
    name: Ping Render Services
    runs-on: ubuntu-latest
    timeout-minutes: 1

    steps:
      - name: Ping CambioMatic
        run: |
          echo "$(date '+%Y-%m-%d %H:%M:%S') - Fazendo request para https://cambiomatic.onrender.com/login ..."
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 20 https://cambiomatic.onrender.com/login)
          echo "$(date '+%Y-%m-%d %H:%M:%S') - Status: $STATUS"

      - name: Ping Fingen
        run: |
          echo "$(date '+%Y-%m-%d %H:%M:%S') - Fazendo request para https://fingen-zcke.onrender.com/ ..."
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 20 https://fingen-app.onrender.com/)
          echo "$(date '+%Y-%m-%d %H:%M:%S') - Status: $STATUS"
